[package]
name = "glidelink"
version = "0.1.0"
description = "Low-latency software KVM for sharing one mouse across machines"
authors = ["GlideLink contributors"]
edition = "2021"
rust-version = "1.77"
license = "GPL-3.0-only"
repository = "https://github.com/Luxru/glidelink"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
chacha20poly1305 = "0.10"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
